<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>js-tictactoe</title>

  <link rel="stylesheet" href="/src/assets/styles/reset.css">
  <link rel="stylesheet" href="/src/assets/styles/style.css">
</head>

<body>
  <!-- <div id="app"></div> -->

  <header>
    <h1>Tic tac toe</h1>
    <div class="header__information">
      <div class="header__information--score">Score <span id="player-one-score">0</span></div>
      <div class="header__information--player">Turn <span id=""></span></div>
      <div class="header__information--score">Score <span id="player-two-score">0</span></div>
    </div>
  </header>

  <main>
    <div class="game_board">
      <div id="A1" class="game_board__cell"></div>
      <div id="A2" class="game_board__cell"></div>
      <div id="A3" class="game_board__cell"></div>
      <div id="B1" class="game_board__cell"></div>
      <div id="B2" class="game_board__cell"></div>
      <div id="B3" class="game_board__cell"></div>
      <div id="C1" class="game_board__cell"></div>
      <div id="C2" class="game_board__cell"></div>
      <div id="C3" class="game_board__cell"></div>
    </div>
  </main>


  <div class="game-controls">
    <button class="game-controls__button" id="restart-score-button">Restart Score</button>
    <button class="game-controls__button" id="new-game-button">New Game</button>
  </div>
  <!-- <script type="module" src="/src/main.js"></script> -->
</body>

</html>
